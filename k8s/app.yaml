# IMAGE_URL, PROJECT_ID, MODEL_NAME e MODEL_LOCATION são trocados pelo sed do
# passo 8 com os valores do config.env.
apiVersion: v1
kind: Namespace
metadata:
  name: nasa
---
# Esse ServiceAccount recebeu roles/aiplatform.user no Terraform (Workload Identity),
# então o pod chama o Gemini sem precisar de nenhuma chave.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nasa-agents
  namespace: nasa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasa-agents
  namespace: nasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nasa-agents
  template:
    metadata:
      labels:
        app: nasa-agents
    spec:
      serviceAccountName: nasa-agents
      containers:
        - name: nasa-agents
          image: IMAGE_URL
          # a tag v1 não muda entre builds, então sempre baixa a versão mais nova
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: MODEL_LOCATION
            - name: GEMINI_MODEL
              value: MODEL_NAME
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
# ClusterIP (só dentro do cluster): o `adk web` não tem login, então não
# expomos na internet. Para acessar, use `kubectl port-forward` (passo 9).
apiVersion: v1
kind: Service
metadata:
  name: nasa-agents
  namespace: nasa
spec:
  selector:
    app: nasa-agents
  ports:
    - port: 80
      targetPort: 8080
